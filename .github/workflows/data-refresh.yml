name: Refresh market data

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download datasets
        run: node scripts/fetch-data.mjs

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: actualiza datos de mercado"
          title: "chore: actualiza datos de mercado"
          body: |
            Actualización automática de los datasets incluidos.

            Revisa que los precios y el rango sean coherentes antes de fusionar.
            El CI validará build, tests y E2E.
          branch: chore/refresh-market-data
          delete-branch: true
          add-paths: data/*.json
