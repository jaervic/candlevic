name: Uptime

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 25 \
            https://candlevic.vercel.app/api/health \
            | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
